name: Verify published directional ghost research
on:
  workflow_run:
    workflows: ["Reader website"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-pages-check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify live research pages, full-result navigator, and responsive assets
        env:
          BASE_URL: https://komorebip.github.io/The-Komorebi-Program/
        run: |
          python3 - <<'PY'
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          from urllib.parse import urlencode

          base = os.environ['BASE_URL']
          paths = (
              'collection/DIRECTIONAL_GHOSTS.html',
              'sequence-network.html',
              'sequence-library.html',
              'assets/sequence-network-ui.mjs',
              'assets/sequence-network-format.mjs',
              'assets/sequence-network.css',
          )
          expected = {
              paths[0]: (
                  'Directional ghosts',
                  'Frobenius',
                  '2026-11-23',
                  'A small reconstruction example',
                  'Notation for implementation',
                  'Alternative minimal rescue coordinates',
                  'mathjax/tex-svg-full.js',
              ),
              paths[1]: (
                  'collection/DIRECTIONAL_GHOSTS.html',
                  'precision-aware',
              ),
              paths[2]: (
                  'collection/DIRECTIONAL_GHOSTS.html',
                  'Precision-aware transfer research',
              ),
              paths[3]: (
                  'data.edges.length',
                  'focusAdded',
                  'sequence-network-format.mjs',
              ),
              paths[4]: (
                  'formatNetworkMath',
                  'algebraLatex',
              ),
              paths[5]: (
                  '.sn-fields',
                  '.sn-more-wrap',
              ),
          }
          latest_errors = []
          for attempt in range(1, 19):
              errors = []
              for path in paths:
                  url = base + path + '?' + urlencode({'check': 'directional-ghosts-2026-11-23'})
                  request = urllib.request.Request(
                      url,
                      headers={'User-Agent': 'Komorebi-publication-check/1.0',
                               'Cache-Control': 'no-cache'})
                  try:
                      with urllib.request.urlopen(request, timeout=18) as response:
                          data = response.read(5_000_000).decode('utf-8', errors='replace')
                          code = response.status
                      if code != 200:
                          errors.append(f'{path}: HTTP {code}')
                      missing = [term for term in expected[path] if term.lower() not in data.lower()]
                      if missing:
                          errors.append(f'{path}: missing expected text {missing!r}')
                  except (urllib.error.URLError, OSError) as exc:
                      errors.append(f'{path}: {exc}')
              if not errors:
                  summary = os.environ.get('GITHUB_STEP_SUMMARY')
                  report = (
                      '## Live Komorebi publication verified\n\n'
                      'The public GitHub Pages server responded with HTTP 200 and the '
                      'expected research text, transfer navigation, and responsive assets:\n\n' +
                      ''.join(f'- {base + path}\n' for path in paths)
                  )
                  print(report)
                  if summary:
                      with open(summary, 'a', encoding='utf-8') as stream:
                          stream.write(report)
                  sys.exit(0)
              latest_errors = errors
              print(f'Attempt {attempt}/18: {errors}', flush=True)
              if attempt != 18:
                  time.sleep(15)
          print('Live publication NOT verified: ' + '; '.join(latest_errors), file=sys.stderr)
          sys.exit(1)
          PY
