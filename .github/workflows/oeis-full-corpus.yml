name: OEIS full-source formula corpus (manual)
on:
  workflow_dispatch:
    inputs:
      max_records:
        description: 'Maximum OEIS source entries (0 = full corpus)'
        required: true
        default: '0'
      include_prefix_mining:
        description: 'Run bounded-memory finite-match mining after source indexing'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  formula-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Snapshot OEIS official GitHub source tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse --branch main https://github.com/oeis/oeisdata.git /tmp/oeisdata
          git -C /tmp/oeisdata sparse-checkout set seq
          git -C /tmp/oeisdata rev-parse HEAD > /tmp/oeis_revision.txt
          cat /tmp/oeis_revision.txt
      - name: Ingest raw attributed formulas and build incremental search index
        shell: bash
        run: |
          set -euo pipefail
          LIMIT='${{ inputs.max_records }}'
          if [[ "$LIMIT" =~ ^[0-9]+$ ]] && (( LIMIT > 0 )); then
            python -B tools/oeis_formula_database.py --db /tmp/oeis-full.sqlite3 ingest-oeis --path /tmp/oeisdata/seq --limit "$LIMIT" > /tmp/oeis-import.json
          elif [[ "$LIMIT" == 0 ]]; then
            python -B tools/oeis_formula_database.py --db /tmp/oeis-full.sqlite3 ingest-oeis --path /tmp/oeisdata/seq > /tmp/oeis-import.json
          else
            echo 'Invalid max_records input' >&2; exit 2
          fi
          python -B tools/sequence_formula_retrieval.py --db /tmp/oeis-full.sqlite3 index > /tmp/oeis-formula-index.json
          python -B tools/sequence_transfer_index.py --db /tmp/oeis-full.sqlite3 index > /tmp/oeis-prefix-index.json
      - name: Optional finite-candidate mining
        if: ${{ inputs.include_prefix_mining == true }}
        run: python -B tools/sequence_transfer_index.py --db /tmp/oeis-full.sqlite3 mine --no-rebuild > /tmp/oeis-prefix-mining.json
      - name: Reproducible provenance and database consistency
        shell: bash
        run: |
          python -B - <<'PY'
          import hashlib,json,pathlib,sqlite3
          p=pathlib.Path('/tmp/oeis-full.sqlite3')
          with sqlite3.connect(p) as db:
              integrity=db.execute('PRAGMA integrity_check').fetchone()[0]
              if integrity!='ok':raise SystemExit('Database integrity failed: '+integrity)
              counts={name:db.execute('SELECT count(*) FROM '+name).fetchone()[0]
                  for name in ['sequences','formulas','formula_text_receipts','transfer_prefix_index']}
          provenance={'oeisdata_git_revision':pathlib.Path('/tmp/oeis_revision.txt').read_text().strip(),
              'source':'https://github.com/oeis/oeisdata','license':'CC-BY-SA-4.0',
              'import':json.loads(pathlib.Path('/tmp/oeis-import.json').read_text()),
              'formula_index':json.loads(pathlib.Path('/tmp/oeis-formula-index.json').read_text()),
              'prefix_index':json.loads(pathlib.Path('/tmp/oeis-prefix-index.json').read_text()),
              'counts':counts,'integrity_check':integrity,
              'scope':'raw source indexing; finite candidates and lexical links are not proofs'}
          pathlib.Path('/tmp/oeis-corpus-provenance.json').write_text(json.dumps(provenance,indent=2)+'\n')
          print(json.dumps(counts))
          PY
      - name: Upload indexed SQLite database and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oeis-formula-corpus
          path: |
            /tmp/oeis-full.sqlite3
            /tmp/oeis-corpus-provenance.json
            /tmp/oeis-import.json
            /tmp/oeis-formula-index.json
            /tmp/oeis-prefix-index.json
          if-no-files-found: error
          retention-days: 30
