name: Directional ghost research checks
on:
  pull_request:
    paths:
      - 'research/directional-ghosts/**'
      - 'docs/DIRECTIONAL_GHOSTS.md'
      - '.github/workflows/directional-ghosts-checks.yml'
  push:
    branches: [main]
    paths:
      - 'research/directional-ghosts/**'
      - 'docs/DIRECTIONAL_GHOSTS.md'
      - '.github/workflows/directional-ghosts-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            research/directional-ghosts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Check exact finite arithmetic and formal-series identities
        run: python -m unittest -v research/directional-ghosts/test_directional_ghosts.py
