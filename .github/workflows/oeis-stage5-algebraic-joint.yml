name: OEIS algebraic and joint transfer gate
on:
  push:
    paths:
      - 'tools/oeis_*.py'
      - 'fixtures/oeis_stage5/**'
      - 'research/sequence-proof-stage5/**'
      - '.github/workflows/oeis-stage5-algebraic-joint.yml'
  pull_request:
    paths:
      - 'tools/oeis_*.py'
      - 'fixtures/oeis_stage5/**'
      - 'research/sequence-proof-stage5/**'
      - '.github/workflows/oeis-stage5-algebraic-joint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-stage5:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/oeis_*.py
            /fixtures/oeis_stage5/
            /research/sequence-proof-stage5/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install pinned algebra runtime
        run: python -m pip install sympy==1.14.0 mpmath==1.3.0
      - name: Test and replay excerpt-based exact certificates
        env:
          PYTHONPATH: tools
        run: |
          python -B -m unittest discover -s research/sequence-proof-stage5/tests -v
          python -B tools/oeis_algebraic_gate.py --oeis-root fixtures/oeis_stage5 --plan fixtures/oeis_stage5/plan.json --output .certificates/excerpts.json
          python -B tools/oeis_algebraic_gate.py --oeis-root fixtures/oeis_stage5 --plan fixtures/oeis_stage5/plan.json --output .certificates/excerpts.json --verify-report
      - name: Fetch and verify the six complete pinned official records
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          plan=json.loads(Path('fixtures/oeis_stage5/full_source_plan.json').read_text())
          root=Path(os.environ['RUNNER_TEMP'])/'oeis-stage5-pinned'
          for row in plan['records']:
              ident=row['id']; rel=f'seq/{ident[:4]}/{ident}.seq'
              dest=root/rel; dest.parent.mkdir(parents=True,exist_ok=True)
              url=f"https://raw.githubusercontent.com/oeis/oeisdata/{plan['origin']['commit']}/{rel}"
              subprocess.run(['curl','--fail','--silent','--show-error','--retry','3','--max-time','60',url,'-o',str(dest)],check=True)
          PY
          python -B tools/oeis_algebraic_gate.py --oeis-root "$RUNNER_TEMP/oeis-stage5-pinned" --plan fixtures/oeis_stage5/full_source_plan.json --output .certificates/full-source.json
          python -B tools/oeis_algebraic_gate.py --oeis-root "$RUNNER_TEMP/oeis-stage5-pinned" --plan fixtures/oeis_stage5/full_source_plan.json --output .certificates/full-source.json --verify-report
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('.certificates/full-source.json').read_text())['summary']
          assert r=={'records':6,'conditional_profiles':6,'algebraic_profiles':3,'joint_certificates':1,'spectral_cover_jobs':1,'composition_certificates':2,'family_normal_forms':3,'finite_sum_normal_forms':3}
          PY
      - name: Preserve certificate reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oeis-stage5-${{ github.sha }}
          path: .certificates/*.json
          if-no-files-found: warn
          retention-days: 14
